<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼츠팩토리 | QUANTA</title>
<style>
  :root {
    --bg: #05060a;
    --bg-elevated: #0d1020;
    --panel: #12162a;
    --panel-border: #262c4a;
    --accent: #7c5cff;
    --accent-2: #33e2c7;
    --text: #eef0ff;
    --text-dim: #9aa0c0;
    --danger: #ff5c7a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,92,255,0.18), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(51,226,199,0.12), transparent 45%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 32px;
    border-bottom: 1px solid var(--panel-border);
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    background: rgba(5,6,10,0.7);
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
  }

  .logo-mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: conic-gradient(from 180deg, var(--accent), var(--accent-2), var(--accent));
    box-shadow: 0 0 24px rgba(124,92,255,0.6);
  }

  .badge {
    font-size: 12px;
    color: var(--accent-2);
    border: 1px solid rgba(51,226,199,0.4);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.08em;
  }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  .hero {
    text-align: center;
    margin-bottom: 48px;
  }

  .hero h1 {
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.25;
    margin: 0 0 12px;
    letter-spacing: -0.03em;
    background: linear-gradient(120deg, #ffffff, var(--accent-2) 60%, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero p {
    color: var(--text-dim);
    font-size: 15px;
    margin: 0;
  }

  .card {
    background: linear-gradient(180deg, var(--panel), var(--bg-elevated));
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  .field { margin-bottom: 18px; }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  select, input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: #0a0d1a;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--accent);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 560px) {
    .row { grid-template-columns: 1fr; }
  }

  button.generate {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    color: #05060a;
    background: linear-gradient(120deg, var(--accent-2), var(--accent));
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    margin-top: 8px;
  }

  button.generate:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,92,255,0.35); }
  button.generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  .result {
    margin-top: 32px;
  }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .result-header h2 {
    font-size: 16px;
    margin: 0;
    color: var(--text-dim);
    font-weight: 600;
  }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }

  .copy-btn:hover { border-color: var(--accent-2); color: var(--accent-2); }

  .script-box {
    white-space: pre-wrap;
    background: #0a0d1a;
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 20px;
    font-size: 14px;
    line-height: 1.7;
    min-height: 120px;
  }

  .script-box.empty {
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .error-box {
    margin-top: 16px;
    border: 1px solid rgba(255,92,122,0.4);
    background: rgba(255,92,122,0.08);
    color: var(--danger);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    display: none;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(5,6,10,0.3);
    border-top-color: #05060a;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    vertical-align: -3px;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    padding: 24px;
  }
</style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-mark"></div>
      쇼츠팩토리
    </div>
    <div class="badge">QUANTA DESIGN</div>
  </header>

  <main>
    <div class="hero">
      <h1>과학상식 쇼츠 대본을<br>10초 만에 만들어보세요</h1>
      <p>주제와 톤을 고르면 AI가 60초 분량의 숏폼 대본을 자동으로 작성합니다.</p>
    </div>

    <div class="card" id="latestCard">
      <div class="result-header">
        <h2>최신 자동 생성 대본</h2>
        <span class="badge" id="latestMeta">불러오는 중...</span>
      </div>
      <div class="script-box empty" id="latestScriptBox">GitHub Actions 탭에서 "소재수집 + 대본생성" 워크플로우를 실행하면 여기에 결과가 표시됩니다.</div>
    </div>

    <div class="card" style="margin-top: 24px;">
      <div class="row">
        <div class="field">
          <label for="topic">주제</label>
          <select id="topic">
            <option value="랜덤">랜덤 (자동 선택)</option>
            <option value="우주">우주</option>
            <option value="물리학">물리학</option>
            <option value="생물학">생물학</option>
            <option value="화학">화학</option>
            <option value="뇌과학">뇌과학</option>
            <option value="인체">인체</option>
            <option value="기후/지구과학">기후·지구과학</option>
            <option value="테크놀로지">테크놀로지</option>
          </select>
        </div>
        <div class="field">
          <label for="tone">톤 & 스타일</label>
          <select id="tone">
            <option value="흥미진진하고 호기심을 자극하는">흥미진진하게</option>
            <option value="차분하고 신뢰감 있는">차분하고 신뢰감 있게</option>
            <option value="유머러스하고 가벼운">유머러스하게</option>
            <option value="긴장감 있고 반전이 있는">반전 있게</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="keyword">세부 키워드 (선택)</label>
        <input type="text" id="keyword" placeholder="예: 블랙홀, 도파민, mRNA 백신 등">
      </div>

      <div class="field">
        <label for="duration">영상 길이</label>
        <select id="duration">
          <option value="30">30초</option>
          <option value="60" selected>60초</option>
          <option value="90">90초</option>
        </select>
      </div>

      <button class="generate" id="generateBtn">대본 생성하기</button>

      <div class="error-box" id="errorBox"></div>

      <div class="result">
        <div class="result-header">
          <h2>생성된 대본</h2>
          <button class="copy-btn" id="copyBtn">복사하기</button>
        </div>
        <div class="script-box empty" id="scriptBox">여기에 생성된 대본이 표시됩니다.</div>
      </div>
    </div>
  </main>

  <footer>쇼츠팩토리 · QUANTA UI</footer>

  <script>
    const generateBtn = document.getElementById('generateBtn');
    const scriptBox = document.getElementById('scriptBox');
    const errorBox = document.getElementById('errorBox');
    const copyBtn = document.getElementById('copyBtn');

    async function generateScript() {
      const topic = document.getElementById('topic').value;
      const tone = document.getElementById('tone').value;
      const keyword = document.getElementById('keyword').value.trim();
      const duration = document.getElementById('duration').value;

      errorBox.style.display = 'none';
      generateBtn.disabled = true;
      generateBtn.innerHTML = '<span class="spinner"></span>생성 중...';
      scriptBox.classList.remove('empty');
      scriptBox.textContent = '';

      try {
        const res = await fetch('/api/generate-script', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic, tone, keyword, duration })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || '대본 생성에 실패했습니다.');
        }

        scriptBox.textContent = data.script;
      } catch (err) {
        errorBox.textContent = err.message || '알 수 없는 오류가 발생했습니다.';
        errorBox.style.display = 'block';
        scriptBox.classList.add('empty');
        scriptBox.textContent = '대본 생성에 실패했습니다. 다시 시도해주세요.';
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = '대본 생성하기';
      }
    }

    generateBtn.addEventListener('click', generateScript);

    async function loadLatestScript() {
      const metaEl = document.getElementById('latestMeta');
      const boxEl = document.getElementById('latestScriptBox');

      try {
        const res = await fetch('scripts/latest.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('latest.json을 불러올 수 없습니다.');
        const data = await res.json();

        if (!data.script) {
          metaEl.textContent = '생성된 대본 없음';
          return;
        }

        const generatedDate = data.generatedAt ? new Date(data.generatedAt).toLocaleString('ko-KR') : '';
        metaEl.textContent = `${data.topic} · ${data.duration}초 · ${generatedDate}`;
        boxEl.classList.remove('empty');
        boxEl.textContent = data.script;
      } catch (err) {
        metaEl.textContent = '불러오기 실패';
      }
    }

    loadLatestScript();

    copyBtn.addEventListener('click', async () => {
      const text = scriptBox.textContent;
      if (!text || scriptBox.classList.contains('empty')) return;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = '복사됨!';
        setTimeout(() => { copyBtn.textContent = '복사하기'; }, 1500);
      } catch (e) {
        // clipboard unavailable; ignore
      }
    });
  </script>
</body>
</html>
