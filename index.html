<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 영어 한 단락 | QUANTA</title>
<style>
  :root {
    --bg: #05060a;
    --bg-elevated: #0d1020;
    --panel: #12162a;
    --panel-border: #262c4a;
    --accent: #7c5cff;
    --accent-2: #33e2c7;
    --text: #eef0ff;
    --text-dim: #9aa0c0;
    --danger: #ff5c7a;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,92,255,0.18), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(51,226,199,0.12), transparent 45%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--panel-border);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    background: rgba(5,6,10,0.82);
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
  }

  .logo-mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: conic-gradient(from 180deg, var(--accent), var(--accent-2), var(--accent));
    box-shadow: 0 0 24px rgba(124,92,255,0.6);
  }

  .badge {
    font-size: 12px;
    color: var(--accent-2);
    border: 1px solid rgba(51,226,199,0.4);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.08em;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .hero {
    text-align: center;
    margin-bottom: 32px;
  }

  .hero h1 {
    font-size: clamp(24px, 5.5vw, 38px);
    line-height: 1.25;
    margin: 0 0 10px;
    letter-spacing: -0.03em;
    background: linear-gradient(120deg, #ffffff, var(--accent-2) 60%, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero p {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0;
  }

  .card {
    background: linear-gradient(180deg, var(--panel), var(--bg-elevated));
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.3);
  }

  .card + .card { margin-top: 24px; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .card-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: rgba(124,92,255,0.15);
    font-size: 15px;
    flex-shrink: 0;
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin: 0;
  }

  .card-subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin: 2px 0 0;
  }

  .status-line {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 10px;
    min-height: 18px;
  }

  .error-box {
    margin-top: 16px;
    border: 1px solid rgba(255,92,122,0.4);
    background: rgba(255,92,122,0.08);
    color: var(--danger);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    display: none;
  }

  .action-btn {
    width: 100%;
    margin-top: 10px;
    padding: 12px 18px;
    border-radius: var(--radius-md);
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: #05060a;
    background: linear-gradient(120deg, var(--accent-2), var(--accent));
    min-height: 44px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }

  .action-btn:hover:not(:disabled) { transform: translateY(-1px); }
  .action-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .empty-note {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 12px 0;
  }

  .paragraph-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin: 14px 0 10px;
  }

  .paragraph-audio {
    width: 100%;
    margin-bottom: 14px;
  }

  .sentence-row {
    border-bottom: 1px solid var(--panel-border);
    padding: 10px 0;
  }

  .sentence-row:last-child { border-bottom: none; }

  .sentence-text { flex: 1; min-width: 0; }

  .dictation-input {
    width: 100%;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--panel-border);
    background: #0a0d1a;
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.5;
    outline: none;
    resize: vertical;
    min-height: 38px;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }

  .dictation-input:focus { border-color: var(--accent); }

  .dictation-input.correct { border-color: var(--accent-2); }
  .dictation-input.incorrect { border-color: var(--danger); }

  .check-btn {
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: rgba(124,92,255,0.12);
    color: var(--text);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  .check-btn:hover { background: rgba(124,92,255,0.2); }

  .check-feedback {
    font-size: 12px;
    margin-top: 6px;
    display: none;
  }

  .check-feedback.correct { display: block; color: var(--accent-2); }
  .check-feedback.incorrect { display: block; color: var(--danger); }

  .reveal-row {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }

  .reveal-btn {
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }

  .reveal-btn:hover { border-color: var(--accent); color: var(--text); }

  .reveal-btn.active {
    border-color: var(--accent-2);
    color: var(--accent-2);
    background: rgba(51,226,199,0.08);
  }

  .reveal-answer { display: none; margin-top: 6px; }
  .reveal-answer.shown { display: block; }

  .sentence-row-inner {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .sentence-en {
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.6;
  }

  .sentence-ko {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
    line-height: 1.5;
  }

  .sentence-controls {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: #05060a;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }

  .icon-btn:hover { border-color: var(--accent); color: var(--text); }

  .icon-btn.active {
    border-color: var(--accent-2);
    color: var(--accent-2);
    background: rgba(51,226,199,0.1);
  }

  .icon-btn.playing {
    border-color: var(--accent);
    color: var(--accent);
  }

  .icon-btn.saved {
    border-color: #ffd166;
    color: #ffd166;
    background: rgba(255,209,102,0.1);
  }

  .paragraph-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 4px;
  }

  .download-all-link {
    font-size: 12px;
    color: var(--accent-2);
    text-decoration: none;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 6px 12px;
  }

  .download-all-link:hover { border-color: var(--accent-2); }

  .list-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm);
    padding: 10px;
    background: #0a0d1a;
    margin-bottom: 8px;
  }

  .list-item-meta { flex: 1; min-width: 0; }

  .list-item-en {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.5;
  }

  .list-item-ko {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 3px;
    line-height: 1.4;
  }

  .list-item-remove {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    flex-shrink: 0;
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    padding: 24px;
  }
</style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-mark"></div>
      오늘의 영어 한 단락
    </div>
    <div class="badge">QUANTA DESIGN</div>
  </header>

  <main>
    <div class="hero">
      <h1>원할 때 만드는<br>영어회화 받아쓰기</h1>
      <p>버튼을 누르면 기초 영어회화 한 단락(약 10문장)이 음성(TTS)으로 새로 생성됩니다 (하루 1번만). 문장을 듣고 직접 받아써본 뒤, "정답 보기"/"한글 뜻 보기"로 확인하세요. 마음에 드는 문장은 리스트에 저장해두세요.</p>
    </div>

    <div class="card" id="paragraphCard">
      <div class="card-header">
        <div class="card-icon">📖</div>
        <div>
          <h2 class="card-title">오늘의 영어 한 단락</h2>
          <p class="card-subtitle" id="paragraphMeta">불러오는 중...</p>
        </div>
      </div>
      <button class="action-btn" id="generateBtn">✨ 오늘의 단락 새로 만들기</button>
      <div class="status-line" id="generateStatus"></div>
      <div class="error-box" id="paragraphErrorBox"></div>
      <div id="paragraphContent"></div>
    </div>

    <div class="card" id="savedListCard">
      <div class="card-header">
        <div class="card-icon">⭐</div>
        <div>
          <h2 class="card-title">저장된 문장</h2>
          <p class="card-subtitle" id="savedListMeta">불러오는 중...</p>
        </div>
      </div>
      <div class="error-box" id="listErrorBox"></div>
      <div id="savedList" style="margin-top: 14px;"></div>
      <div class="empty-note" id="savedEmptyNote" style="display: none;">아직 저장된 문장이 없습니다. 위 문장의 ⭐ 버튼을 눌러 추가해보세요.</div>
      <button class="action-btn" id="saveListBtn" style="display: none;">💾 변경사항 저장</button>
      <div class="status-line" id="saveListStatus"></div>
    </div>
  </main>

  <footer>오늘의 영어 한 단락 · QUANTA UI</footer>

  <script>
    const VERCEL_APP_URL = 'https://shortapp-mu.vercel.app';
    const API_BASE_URL = location.hostname.endsWith('.vercel.app') ? '' : VERCEL_APP_URL;

    // --- Saved sentences ---

    const savedListEl = document.getElementById('savedList');
    const savedEmptyNote = document.getElementById('savedEmptyNote');
    const savedListMeta = document.getElementById('savedListMeta');
    const saveListBtn = document.getElementById('saveListBtn');
    const saveListStatus = document.getElementById('saveListStatus');
    const listErrorBox = document.getElementById('listErrorBox');

    let savedItems = [];

    function sentenceKey(en) {
      return en;
    }

    function isSentenceSaved(en) {
      return savedItems.some((it) => sentenceKey(it.en) === sentenceKey(en));
    }

    function renderSavedList() {
      savedListEl.innerHTML = '';
      savedEmptyNote.style.display = savedItems.length === 0 ? 'block' : 'none';
      saveListBtn.style.display = 'block';

      savedItems.forEach((it) => {
        const row = document.createElement('div');
        row.className = 'list-item';

        const meta = document.createElement('div');
        meta.className = 'list-item-meta';
        const en = document.createElement('div');
        en.className = 'list-item-en';
        en.textContent = it.en;
        meta.appendChild(en);
        if (it.ko) {
          const ko = document.createElement('div');
          ko.className = 'list-item-ko';
          ko.textContent = it.ko;
          meta.appendChild(ko);
        }
        row.appendChild(meta);

        if (it.audio) {
          const savedSrc = `data/${it.audio}?t=${Date.now()}`;
          const controls = document.createElement('div');
          controls.className = 'sentence-controls';

          const playBtn = document.createElement('button');
          playBtn.className = 'icon-btn';
          playBtn.title = '재생';
          playBtn.textContent = '▶';
          playBtn.addEventListener('click', () => playSentenceOnce(savedSrc, playBtn));
          controls.appendChild(playBtn);

          const loopBtn = document.createElement('button');
          loopBtn.className = 'icon-btn';
          loopBtn.title = '반복 재생';
          loopBtn.textContent = '🔁';
          loopBtn.addEventListener('click', () => toggleSentenceLoop(savedSrc, loopBtn));
          controls.appendChild(loopBtn);

          const downloadLink = document.createElement('a');
          downloadLink.className = 'icon-btn';
          downloadLink.title = '다운로드';
          downloadLink.href = savedSrc;
          downloadLink.download = `${(it.date || 'saved')}-${sentenceKey(it.en).slice(0, 20)}.mp3`;
          downloadLink.textContent = '⬇';
          controls.appendChild(downloadLink);

          row.appendChild(controls);
        }

        const removeBtn = document.createElement('button');
        removeBtn.className = 'list-item-remove';
        removeBtn.textContent = '✕';
        removeBtn.addEventListener('click', () => {
          savedItems = savedItems.filter((x) => sentenceKey(x.en) !== sentenceKey(it.en));
          renderSavedList();
          syncSentenceSaveButtons();
        });
        row.appendChild(removeBtn);

        savedListEl.appendChild(row);
      });
    }

    async function saveList() {
      saveListBtn.disabled = true;
      saveListStatus.textContent = '저장 중...';

      try {
        const res = await fetch(`${API_BASE_URL}/api/save-sentences`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: savedItems })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || '저장에 실패했습니다.');
        }

        saveListStatus.textContent = '저장 완료! (GitHub Pages 반영에는 1분 정도 걸릴 수 있어요.)';
      } catch (err) {
        saveListStatus.textContent = `저장 실패: ${err.message}`;
      } finally {
        saveListBtn.disabled = false;
      }
    }

    saveListBtn.addEventListener('click', saveList);

    async function loadSavedList() {
      try {
        const res = await fetch(`data/saved-sentences.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`saved-sentences.json 요청 실패 (HTTP ${res.status})`);
        const data = await res.json();

        savedItems = Array.isArray(data.items) ? data.items : [];
        const updatedDate = data.updatedAt ? new Date(data.updatedAt).toLocaleString('ko-KR') : null;
        savedListMeta.textContent = updatedDate
          ? `${savedItems.length}개 저장됨 · ${updatedDate} 업데이트`
          : `${savedItems.length}개 저장됨`;
        renderSavedList();
      } catch (err) {
        listErrorBox.textContent = `리스트를 불러오지 못했습니다: ${err.message}`;
        listErrorBox.style.display = 'block';
        savedListMeta.textContent = '';
        renderSavedList();
      }
    }

    // --- Daily paragraph ---

    const paragraphMeta = document.getElementById('paragraphMeta');
    const paragraphErrorBox = document.getElementById('paragraphErrorBox');
    const paragraphContent = document.getElementById('paragraphContent');
    const generateBtn = document.getElementById('generateBtn');
    const generateStatus = document.getElementById('generateStatus');

    let latestParagraphDate = null;
    let pollTimer = null;

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function updateGenerateButtonState() {
      if (latestParagraphDate === todayStr()) {
        generateBtn.disabled = true;
        generateBtn.textContent = '✓ 오늘은 이미 생성했습니다';
      } else {
        generateBtn.disabled = false;
        generateBtn.textContent = '✨ 오늘의 단락 새로 만들기';
      }
    }

    async function generateParagraph() {
      generateBtn.disabled = true;
      generateStatus.textContent = '생성 요청 중...';

      try {
        const res = await fetch(`${API_BASE_URL}/api/generate-paragraph`, { method: 'POST' });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || '생성 요청에 실패했습니다.');
        }

        generateStatus.textContent = '생성 중입니다... 보통 1~2분 걸려요. (자동으로 새로고침됩니다)';
        if (pollTimer) clearInterval(pollTimer);
        let attempts = 0;
        pollTimer = setInterval(async () => {
          attempts += 1;
          await loadDailyParagraph();
          if (latestParagraphDate === todayStr() || attempts >= 18) {
            clearInterval(pollTimer);
            pollTimer = null;
            generateStatus.textContent = latestParagraphDate === todayStr()
              ? '새 단락이 생성되었습니다!'
              : '아직 생성 중일 수 있어요. 잠시 후 새로고침 해보세요.';
          }
        }, 10000);
      } catch (err) {
        generateStatus.textContent = `생성 실패: ${err.message}`;
        updateGenerateButtonState();
      }
    }

    generateBtn.addEventListener('click', generateParagraph);

    // Shared playback state so clicking a new sentence's play/loop button
    // stops whatever was previously playing instead of overlapping audio.
    let sentenceAudio = null;
    let activeLoopBtn = null;

    function stopSentenceAudio() {
      if (sentenceAudio) sentenceAudio.pause();
      document.querySelectorAll('.icon-btn.playing, .icon-btn.active')
        .forEach((b) => b.classList.remove('playing', 'active'));
      activeLoopBtn = null;
    }

    function playSentenceOnce(src, playBtn) {
      stopSentenceAudio();
      sentenceAudio = new Audio(src);
      playBtn.classList.add('playing');
      sentenceAudio.addEventListener('ended', () => playBtn.classList.remove('playing'));
      sentenceAudio.play();
    }

    function toggleSentenceLoop(src, loopBtn) {
      if (activeLoopBtn === loopBtn) {
        stopSentenceAudio();
        return;
      }
      stopSentenceAudio();
      sentenceAudio = new Audio(src);
      sentenceAudio.loop = true;
      loopBtn.classList.add('active');
      activeLoopBtn = loopBtn;
      sentenceAudio.play();
    }

    // Re-reads savedItems to refresh every rendered sentence's ⭐ button
    // state (used after a removal in the saved-list card below).
    function syncSentenceSaveButtons() {
      paragraphContent.querySelectorAll('[data-save-en]').forEach((btn) => {
        const en = btn.getAttribute('data-save-en');
        btn.classList.toggle('saved', isSentenceSaved(en));
      });
    }

    function toggleSaveSentence(sentence, topic, date, saveBtn) {
      if (isSentenceSaved(sentence.en)) {
        savedItems = savedItems.filter((x) => sentenceKey(x.en) !== sentenceKey(sentence.en));
      } else {
        savedItems.push({
          en: sentence.en,
          ko: sentence.ko,
          audio: sentence.audio || null,
          topic: topic || null,
          date: date || null
        });
      }
      renderSavedList();
      syncSentenceSaveButtons();
    }

    async function loadDailyParagraph() {
      try {
        const res = await fetch(`data/daily-paragraph.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`daily-paragraph.json 요청 실패 (HTTP ${res.status})`);
        const data = await res.json();

        if (!data.title || !Array.isArray(data.sentences) || data.sentences.length === 0) {
          paragraphMeta.textContent = '아직 생성된 단락이 없습니다. 위 버튼을 눌러 만들어보세요.';
          paragraphContent.innerHTML = '';
          latestParagraphDate = null;
          updateGenerateButtonState();
          return;
        }

        latestParagraphDate = data.date || null;
        updateGenerateButtonState();

        paragraphMeta.textContent = `${data.date || ''} · ${data.topic || ''}`;
        paragraphContent.innerHTML = '';
        stopSentenceAudio();

        const title = document.createElement('div');
        title.className = 'paragraph-title';
        title.textContent = data.title;
        paragraphContent.appendChild(title);

        if (data.audio) {
          const fullSrc = `data/${data.audio}?t=${Date.now()}`;

          const toolbar = document.createElement('div');
          toolbar.className = 'paragraph-toolbar';
          const downloadAllLink = document.createElement('a');
          downloadAllLink.className = 'download-all-link';
          downloadAllLink.href = fullSrc;
          downloadAllLink.download = `${data.date || 'daily'}-full.mp3`;
          downloadAllLink.textContent = '⬇ 전체 음성 다운로드';
          toolbar.appendChild(downloadAllLink);
          paragraphContent.appendChild(toolbar);

          const audio = document.createElement('audio');
          audio.className = 'paragraph-audio';
          audio.controls = true;
          audio.src = fullSrc;
          paragraphContent.appendChild(audio);
        }

        data.sentences.forEach((s, i) => {
          const row = document.createElement('div');
          row.className = 'sentence-row';

          const inner = document.createElement('div');
          inner.className = 'sentence-row-inner';

          const textWrap = document.createElement('div');
          textWrap.className = 'sentence-text';

          const input = document.createElement('textarea');
          input.className = 'dictation-input';
          input.rows = 1;
          input.placeholder = '들리는 대로 받아써보세요 (Enter로 채점)';
          const storageKey = `dictation:${data.date || 'daily'}:${i}`;
          try {
            const savedDraft = localStorage.getItem(storageKey);
            if (savedDraft) input.value = savedDraft;
          } catch (e) { /* localStorage unavailable (private mode, etc.) — ignore */ }

          const checkFeedback = document.createElement('div');
          checkFeedback.className = 'check-feedback';

          input.addEventListener('input', () => {
            try { localStorage.setItem(storageKey, input.value); } catch (e) { /* ignore */ }
            input.classList.remove('correct', 'incorrect');
            checkFeedback.className = 'check-feedback';
          });
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              checkAnswer();
            }
          });
          textWrap.appendChild(input);
          textWrap.appendChild(checkFeedback);

          const revealRow = document.createElement('div');
          revealRow.className = 'reveal-row';

          const en = document.createElement('div');
          en.className = 'sentence-en reveal-answer';
          en.textContent = s.en;

          const ko = document.createElement('div');
          ko.className = 'sentence-ko reveal-answer';
          ko.textContent = s.ko;

          // Loose match: ignores case, punctuation and extra whitespace so
          // "Hello, world!" and "hello world" are treated as the same answer.
          function normalizeSentence(text) {
            return text
              .toLowerCase()
              .replace(/[.,!?;:"'’]/g, '')
              .trim()
              .replace(/\s+/g, ' ');
          }

          function checkAnswer() {
            const isCorrect = normalizeSentence(input.value) === normalizeSentence(s.en) && input.value.trim() !== '';
            input.classList.toggle('correct', isCorrect);
            input.classList.toggle('incorrect', !isCorrect);
            checkFeedback.className = 'check-feedback ' + (isCorrect ? 'correct' : 'incorrect');
            checkFeedback.textContent = isCorrect ? '✅ 정답입니다!' : '❌ 다시 확인해보세요.';
          }

          const checkBtn = document.createElement('button');
          checkBtn.className = 'check-btn';
          checkBtn.textContent = '✅ 채점하기';
          checkBtn.addEventListener('click', checkAnswer);
          revealRow.appendChild(checkBtn);

          const enBtn = document.createElement('button');
          enBtn.className = 'reveal-btn';
          enBtn.textContent = '정답 보기';
          enBtn.addEventListener('click', () => {
            const shown = en.classList.toggle('shown');
            enBtn.classList.toggle('active', shown);
            enBtn.textContent = shown ? '정답 숨기기' : '정답 보기';
          });
          revealRow.appendChild(enBtn);

          const koBtn = document.createElement('button');
          koBtn.className = 'reveal-btn';
          koBtn.textContent = '한글 뜻 보기';
          koBtn.addEventListener('click', () => {
            const shown = ko.classList.toggle('shown');
            koBtn.classList.toggle('active', shown);
            koBtn.textContent = shown ? '한글 뜻 숨기기' : '한글 뜻 보기';
          });
          revealRow.appendChild(koBtn);

          textWrap.appendChild(revealRow);
          textWrap.appendChild(en);
          textWrap.appendChild(ko);
          inner.appendChild(textWrap);

          const controls = document.createElement('div');
          controls.className = 'sentence-controls';

          const saveBtn = document.createElement('button');
          saveBtn.className = 'icon-btn' + (isSentenceSaved(s.en) ? ' saved' : '');
          saveBtn.title = '리스트에 저장';
          saveBtn.textContent = '⭐';
          saveBtn.setAttribute('data-save-en', s.en);
          saveBtn.addEventListener('click', () => toggleSaveSentence(s, data.topic, data.date, saveBtn));
          controls.appendChild(saveBtn);

          if (s.audio) {
            const sentenceSrc = `data/${s.audio}?t=${Date.now()}`;

            const playBtn = document.createElement('button');
            playBtn.className = 'icon-btn';
            playBtn.title = '재생';
            playBtn.textContent = '▶';
            playBtn.addEventListener('click', () => playSentenceOnce(sentenceSrc, playBtn));
            controls.appendChild(playBtn);

            const loopBtn = document.createElement('button');
            loopBtn.className = 'icon-btn';
            loopBtn.title = '반복 재생';
            loopBtn.textContent = '🔁';
            loopBtn.addEventListener('click', () => toggleSentenceLoop(sentenceSrc, loopBtn));
            controls.appendChild(loopBtn);

            const downloadLink = document.createElement('a');
            downloadLink.className = 'icon-btn';
            downloadLink.title = '다운로드';
            downloadLink.href = sentenceSrc;
            downloadLink.download = `${String(i + 1).padStart(2, '0')}-${(data.date || 'daily')}.mp3`;
            downloadLink.textContent = '⬇';
            controls.appendChild(downloadLink);
          }

          inner.appendChild(controls);
          row.appendChild(inner);
          paragraphContent.appendChild(row);
        });
      } catch (err) {
        paragraphErrorBox.textContent = `오늘의 단락을 불러오지 못했습니다: ${err.message}`;
        paragraphErrorBox.style.display = 'block';
      }
    }

    async function init() {
      await loadSavedList();
      await loadDailyParagraph();
    }

    init();
  </script>
</body>
</html>
