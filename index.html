<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어회화 유튜브 큐레이션 | QUANTA</title>
<style>
  :root {
    --bg: #05060a;
    --bg-elevated: #0d1020;
    --panel: #12162a;
    --panel-border: #262c4a;
    --accent: #7c5cff;
    --accent-2: #33e2c7;
    --text: #eef0ff;
    --text-dim: #9aa0c0;
    --danger: #ff5c7a;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,92,255,0.18), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(51,226,199,0.12), transparent 45%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--panel-border);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    background: rgba(5,6,10,0.82);
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
  }

  .logo-mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: conic-gradient(from 180deg, var(--accent), var(--accent-2), var(--accent));
    box-shadow: 0 0 24px rgba(124,92,255,0.6);
  }

  .badge {
    font-size: 12px;
    color: var(--accent-2);
    border: 1px solid rgba(51,226,199,0.4);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.08em;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .hero {
    text-align: center;
    margin-bottom: 32px;
  }

  .hero h1 {
    font-size: clamp(24px, 5.5vw, 38px);
    line-height: 1.25;
    margin: 0 0 10px;
    letter-spacing: -0.03em;
    background: linear-gradient(120deg, #ffffff, var(--accent-2) 60%, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero p {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0;
  }

  .card {
    background: linear-gradient(180deg, var(--panel), var(--bg-elevated));
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.3);
  }

  .card + .card { margin-top: 24px; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .card-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: rgba(124,92,255,0.15);
    font-size: 15px;
    flex-shrink: 0;
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin: 0;
  }

  .card-subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin: 2px 0 0;
  }

  .status-line {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 10px;
    min-height: 18px;
  }

  .error-box {
    margin-top: 16px;
    border: 1px solid rgba(255,92,122,0.4);
    background: rgba(255,92,122,0.08);
    color: var(--danger);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    display: none;
  }

  .topic-row {
    display: flex;
    gap: 8px;
  }

  .topic-row input {
    flex: 1;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--panel-border);
    background: #0a0d1a;
    color: var(--text);
    font-size: 13px;
    outline: none;
    min-height: 44px;
    transition: border-color 0.15s ease;
  }

  .topic-row input:focus { border-color: var(--accent); }

  .topic-row button {
    padding: 0 18px;
    border-radius: var(--radius-sm);
    border: none;
    background: linear-gradient(120deg, var(--accent-2), var(--accent));
    color: #05060a;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    min-height: 44px;
  }
  .topic-row button:disabled { opacity: 0.5; cursor: not-allowed; }

  .result-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 14px;
  }

  .result-item {
    display: flex;
    gap: 10px;
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm);
    padding: 10px;
    background: #0a0d1a;
  }

  .result-item img {
    width: 92px;
    height: 68px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    background: #000;
  }

  .result-meta { flex: 1; min-width: 0; }

  .result-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .result-title a { color: inherit; text-decoration: none; }
  .result-title a:hover { color: var(--accent-2); }

  .result-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .result-comment {
    font-size: 12px;
    color: var(--accent-2);
    margin-top: 6px;
    line-height: 1.5;
  }

  .result-comment.empty {
    color: var(--text-dim);
    font-style: italic;
  }

  .save-btn {
    margin-top: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }

  .save-btn.saved {
    border-color: var(--accent-2);
    color: var(--accent-2);
    background: rgba(51,226,199,0.08);
  }

  .list-item {
    display: flex;
    gap: 10px;
    align-items: center;
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm);
    padding: 10px;
    background: #0a0d1a;
    margin-bottom: 8px;
  }

  .list-item img {
    width: 72px;
    height: 54px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    background: #000;
  }

  .list-item-meta { flex: 1; min-width: 0; }

  .list-item-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
  }

  .list-item-title a { color: inherit; text-decoration: none; }
  .list-item-title a:hover { color: var(--accent-2); }

  .list-item-comment {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .list-item-remove {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    flex-shrink: 0;
  }

  .action-btn {
    width: 100%;
    margin-top: 10px;
    padding: 12px 18px;
    border-radius: var(--radius-md);
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: #05060a;
    background: linear-gradient(120deg, var(--accent-2), var(--accent));
    min-height: 44px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }

  .action-btn:hover:not(:disabled) { transform: translateY(-1px); }
  .action-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .empty-note {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 12px 0;
  }

  .paragraph-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin: 14px 0 10px;
  }

  .paragraph-audio {
    width: 100%;
    margin-bottom: 14px;
  }

  .sentence-row {
    border-bottom: 1px solid var(--panel-border);
    padding: 10px 0;
  }

  .sentence-row:last-child { border-bottom: none; }

  .sentence-text { flex: 1; min-width: 0; }

  .sentence-row-inner {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .sentence-en {
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.6;
  }

  .sentence-ko {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
    line-height: 1.5;
  }

  .sentence-controls {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: #05060a;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }

  .icon-btn:hover { border-color: var(--accent); color: var(--text); }

  .icon-btn.active {
    border-color: var(--accent-2);
    color: var(--accent-2);
    background: rgba(51,226,199,0.1);
  }

  .icon-btn.playing {
    border-color: var(--accent);
    color: var(--accent);
  }

  .paragraph-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 4px;
  }

  .download-all-link {
    font-size: 12px;
    color: var(--accent-2);
    text-decoration: none;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 6px 12px;
  }

  .download-all-link:hover { border-color: var(--accent-2); }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    padding: 24px;
  }
</style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-mark"></div>
      영어회화 큐레이션
    </div>
    <div class="badge">QUANTA DESIGN</div>
  </header>

  <main>
    <div class="hero">
      <h1>영어회화 유튜브 영상을<br>검색하고 모아보세요</h1>
      <p>주제를 검색하면 AI가 각 영상에 짧은 추천 코멘트를 붙여줍니다. 마음에 드는 영상을 리스트에 저장해두세요.</p>
    </div>

    <div class="card" id="dailyCard">
      <div class="card-header">
        <div class="card-icon">☀️</div>
        <div>
          <h2 class="card-title">오늘의 기초 영어회화</h2>
          <p class="card-subtitle" id="dailyMeta">불러오는 중...</p>
        </div>
      </div>
      <div class="error-box" id="dailyErrorBox"></div>
      <div class="result-list" id="dailyList"></div>
    </div>

    <div class="card" id="controlCard">
      <div class="card-header">
        <div class="card-icon">🔎</div>
        <div>
          <h2 class="card-title">영상 검색</h2>
          <p class="card-subtitle">주제나 키워드로 영어회화 관련 유튜브 영상을 찾아보세요</p>
        </div>
      </div>

      <div class="topic-row" style="margin-top: 16px;">
        <input type="text" id="topicInput" placeholder="예: 여행 영어회화, 비즈니스 영어, 전화 영어 표현">
        <button id="searchBtn">검색</button>
      </div>
      <div class="status-line" id="searchStatus"></div>

      <div class="result-list" id="resultList"></div>
    </div>

    <div class="card" id="paragraphCard">
      <div class="card-header">
        <div class="card-icon">📖</div>
        <div>
          <h2 class="card-title">오늘의 영어 한 단락</h2>
          <p class="card-subtitle" id="paragraphMeta">불러오는 중...</p>
        </div>
      </div>
      <div class="error-box" id="paragraphErrorBox"></div>
      <div id="paragraphContent"></div>
    </div>

    <div class="card" id="savedListCard">
      <div class="card-header">
        <div class="card-icon">⭐</div>
        <div>
          <h2 class="card-title">저장된 추천 리스트</h2>
          <p class="card-subtitle" id="savedListMeta">불러오는 중...</p>
        </div>
      </div>
      <div class="error-box" id="listErrorBox"></div>
      <div id="savedList" style="margin-top: 14px;"></div>
      <div class="empty-note" id="savedEmptyNote" style="display: none;">아직 저장된 영상이 없습니다. 위에서 검색해 추가해보세요.</div>
      <button class="action-btn" id="saveListBtn" style="display: none;">💾 변경사항 저장</button>
      <div class="status-line" id="saveListStatus"></div>
    </div>
  </main>

  <footer>영어회화 큐레이션 · QUANTA UI</footer>

  <script>
    const VERCEL_APP_URL = 'https://shortapp-mu.vercel.app';
    const API_BASE_URL = location.hostname.endsWith('.vercel.app') ? '' : VERCEL_APP_URL;

    const topicInput = document.getElementById('topicInput');
    const searchBtn = document.getElementById('searchBtn');
    const searchStatus = document.getElementById('searchStatus');
    const resultList = document.getElementById('resultList');

    // --- Search ---

    function formatDuration(seconds) {
      if (!seconds) return '';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function isSaved(videoId) {
      return savedItems.some((it) => it.videoId === videoId);
    }

    let lastCandidates = [];
    let lastDailyItems = [];

    function renderResultItems(container, candidates) {
      container.innerHTML = '';
      candidates.forEach((c) => {
        const item = document.createElement('div');
        item.className = 'result-item';

        const img = document.createElement('img');
        img.src = c.thumbnail || '';
        item.appendChild(img);

        const meta = document.createElement('div');
        meta.className = 'result-meta';

        const title = document.createElement('div');
        title.className = 'result-title';
        const titleLink = document.createElement('a');
        titleLink.href = c.url;
        titleLink.target = '_blank';
        titleLink.rel = 'noopener';
        titleLink.textContent = c.title;
        title.appendChild(titleLink);
        meta.appendChild(title);

        const sub = document.createElement('div');
        sub.className = 'result-sub';
        sub.textContent = `${c.channelTitle} · ${formatDuration(c.durationSeconds)}`;
        meta.appendChild(sub);

        const comment = document.createElement('div');
        comment.className = c.comment ? 'result-comment' : 'result-comment empty';
        comment.textContent = c.comment || 'AI 추천 코멘트를 생성하지 못했습니다.';
        meta.appendChild(comment);

        const saveBtn = document.createElement('button');
        saveBtn.className = 'save-btn' + (isSaved(c.videoId) ? ' saved' : '');
        saveBtn.textContent = isSaved(c.videoId) ? '✓ 리스트에 저장됨' : '+ 리스트에 추가';
        saveBtn.addEventListener('click', () => {
          if (isSaved(c.videoId)) {
            savedItems = savedItems.filter((it) => it.videoId !== c.videoId);
          } else {
            savedItems.push({
              videoId: c.videoId,
              title: c.title,
              channelTitle: c.channelTitle,
              thumbnail: c.thumbnail,
              durationSeconds: c.durationSeconds,
              url: c.url,
              comment: c.comment
            });
          }
          renderSavedList();
          saveBtn.className = 'save-btn' + (isSaved(c.videoId) ? ' saved' : '');
          saveBtn.textContent = isSaved(c.videoId) ? '✓ 리스트에 저장됨' : '+ 리스트에 추가';
        });
        meta.appendChild(saveBtn);

        item.appendChild(meta);
        container.appendChild(item);
      });
    }

    function renderResults(candidates) {
      lastCandidates = candidates;
      renderResultItems(resultList, candidates);
    }

    async function search() {
      const query = topicInput.value.trim();
      if (!query) {
        searchStatus.textContent = '검색어를 입력하세요.';
        return;
      }

      searchBtn.disabled = true;
      searchStatus.textContent = '검색 중... (AI 추천 코멘트 생성까지 몇 초 더 걸릴 수 있어요)';
      resultList.innerHTML = '';

      try {
        const res = await fetch(`${API_BASE_URL}/api/search-videos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || '검색에 실패했습니다.');
        }

        const candidates = data.candidates || [];
        searchStatus.textContent = candidates.length > 0
          ? `${candidates.length}개 영상을 찾았습니다.`
          : '검색 결과가 없습니다. 다른 검색어로 시도해보세요.';
        renderResults(candidates);
      } catch (err) {
        searchStatus.textContent = `검색 실패: ${err.message}`;
      } finally {
        searchBtn.disabled = false;
      }
    }

    searchBtn.addEventListener('click', search);
    topicInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });

    // --- Saved list ---

    const savedListEl = document.getElementById('savedList');
    const savedEmptyNote = document.getElementById('savedEmptyNote');
    const savedListMeta = document.getElementById('savedListMeta');
    const saveListBtn = document.getElementById('saveListBtn');
    const saveListStatus = document.getElementById('saveListStatus');
    const listErrorBox = document.getElementById('listErrorBox');

    let savedItems = [];
    let savedTopic = null;

    function renderSavedList() {
      savedListEl.innerHTML = '';
      savedEmptyNote.style.display = savedItems.length === 0 ? 'block' : 'none';
      saveListBtn.style.display = 'block';

      savedItems.forEach((it) => {
        const row = document.createElement('div');
        row.className = 'list-item';

        const img = document.createElement('img');
        img.src = it.thumbnail || '';
        row.appendChild(img);

        const meta = document.createElement('div');
        meta.className = 'list-item-meta';
        const title = document.createElement('div');
        title.className = 'list-item-title';
        const titleLink = document.createElement('a');
        titleLink.href = it.url;
        titleLink.target = '_blank';
        titleLink.rel = 'noopener';
        titleLink.textContent = it.title;
        title.appendChild(titleLink);
        meta.appendChild(title);

        if (it.comment) {
          const comment = document.createElement('div');
          comment.className = 'list-item-comment';
          comment.textContent = it.comment;
          meta.appendChild(comment);
        }
        row.appendChild(meta);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'list-item-remove';
        removeBtn.textContent = '✕';
        removeBtn.addEventListener('click', () => {
          savedItems = savedItems.filter((x) => x.videoId !== it.videoId);
          renderSavedList();
          renderResultItems(resultList, lastCandidates);
          renderResultItems(dailyList, lastDailyItems);
        });
        row.appendChild(removeBtn);

        savedListEl.appendChild(row);
      });
    }

    async function saveList() {
      saveListBtn.disabled = true;
      saveListStatus.textContent = '저장 중...';

      try {
        const res = await fetch(`${API_BASE_URL}/api/save-recommendations`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic: savedTopic || topicInput.value.trim(), items: savedItems })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || '저장에 실패했습니다.');
        }

        saveListStatus.textContent = '저장 완료! (GitHub Pages 반영에는 1분 정도 걸릴 수 있어요.)';
      } catch (err) {
        saveListStatus.textContent = `저장 실패: ${err.message}`;
      } finally {
        saveListBtn.disabled = false;
      }
    }

    saveListBtn.addEventListener('click', saveList);

    async function loadSavedList() {
      try {
        const res = await fetch(`data/recommendations.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`recommendations.json 요청 실패 (HTTP ${res.status})`);
        const data = await res.json();

        savedItems = Array.isArray(data.items) ? data.items : [];
        savedTopic = data.topic || null;
        const updatedDate = data.updatedAt ? new Date(data.updatedAt).toLocaleString('ko-KR') : null;
        savedListMeta.textContent = updatedDate
          ? `${savedItems.length}개 저장됨 · ${updatedDate} 업데이트`
          : `${savedItems.length}개 저장됨`;
        renderSavedList();
      } catch (err) {
        listErrorBox.textContent = `리스트를 불러오지 못했습니다: ${err.message}`;
        listErrorBox.style.display = 'block';
        savedListMeta.textContent = '';
        renderSavedList();
      }
    }

    // --- Daily pick ---

    const dailyList = document.getElementById('dailyList');
    const dailyMeta = document.getElementById('dailyMeta');
    const dailyErrorBox = document.getElementById('dailyErrorBox');

    async function loadDailyPick() {
      try {
        const res = await fetch(`data/daily.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`daily.json 요청 실패 (HTTP ${res.status})`);
        const data = await res.json();

        if (!data.topic || !Array.isArray(data.items) || data.items.length === 0) {
          dailyMeta.textContent = '아직 생성된 오늘의 주제가 없습니다. (매일 오전 7시 자동 생성)';
          lastDailyItems = [];
          renderResultItems(dailyList, []);
          return;
        }

        lastDailyItems = data.items;
        dailyMeta.textContent = `${data.date || ''} · ${data.topic}`;
        renderResultItems(dailyList, data.items);
      } catch (err) {
        dailyErrorBox.textContent = `오늘의 주제를 불러오지 못했습니다: ${err.message}`;
        dailyErrorBox.style.display = 'block';
      }
    }

    // --- Daily paragraph ---

    const paragraphMeta = document.getElementById('paragraphMeta');
    const paragraphErrorBox = document.getElementById('paragraphErrorBox');
    const paragraphContent = document.getElementById('paragraphContent');

    // Shared playback state so clicking a new sentence's play/loop button
    // stops whatever was previously playing instead of overlapping audio.
    let sentenceAudio = null;
    let activeLoopBtn = null;

    function stopSentenceAudio() {
      if (sentenceAudio) sentenceAudio.pause();
      paragraphContent.querySelectorAll('.icon-btn.playing, .icon-btn.active')
        .forEach((b) => b.classList.remove('playing', 'active'));
      activeLoopBtn = null;
    }

    function playSentenceOnce(src, playBtn) {
      stopSentenceAudio();
      sentenceAudio = new Audio(src);
      playBtn.classList.add('playing');
      sentenceAudio.addEventListener('ended', () => playBtn.classList.remove('playing'));
      sentenceAudio.play();
    }

    function toggleSentenceLoop(src, loopBtn) {
      if (activeLoopBtn === loopBtn) {
        stopSentenceAudio();
        return;
      }
      stopSentenceAudio();
      sentenceAudio = new Audio(src);
      sentenceAudio.loop = true;
      loopBtn.classList.add('active');
      activeLoopBtn = loopBtn;
      sentenceAudio.play();
    }

    async function loadDailyParagraph() {
      try {
        const res = await fetch(`data/daily-paragraph.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`daily-paragraph.json 요청 실패 (HTTP ${res.status})`);
        const data = await res.json();

        if (!data.title || !Array.isArray(data.sentences) || data.sentences.length === 0) {
          paragraphMeta.textContent = '아직 생성된 오늘의 단락이 없습니다. (매일 오전 7시 자동 생성)';
          paragraphContent.innerHTML = '';
          return;
        }

        paragraphMeta.textContent = `${data.date || ''} · ${data.topic || ''}`;
        paragraphContent.innerHTML = '';
        stopSentenceAudio();

        const title = document.createElement('div');
        title.className = 'paragraph-title';
        title.textContent = data.title;
        paragraphContent.appendChild(title);

        if (data.audio) {
          const fullSrc = `data/${data.audio}?t=${Date.now()}`;

          const toolbar = document.createElement('div');
          toolbar.className = 'paragraph-toolbar';
          const downloadAllLink = document.createElement('a');
          downloadAllLink.className = 'download-all-link';
          downloadAllLink.href = fullSrc;
          downloadAllLink.download = `${data.date || 'daily'}-full.mp3`;
          downloadAllLink.textContent = '⬇ 전체 음성 다운로드';
          toolbar.appendChild(downloadAllLink);
          paragraphContent.appendChild(toolbar);

          const audio = document.createElement('audio');
          audio.className = 'paragraph-audio';
          audio.controls = true;
          audio.src = fullSrc;
          paragraphContent.appendChild(audio);
        }

        data.sentences.forEach((s, i) => {
          const row = document.createElement('div');
          row.className = 'sentence-row';

          const inner = document.createElement('div');
          inner.className = 'sentence-row-inner';

          const textWrap = document.createElement('div');
          textWrap.className = 'sentence-text';
          const en = document.createElement('div');
          en.className = 'sentence-en';
          en.textContent = s.en;
          textWrap.appendChild(en);
          const ko = document.createElement('div');
          ko.className = 'sentence-ko';
          ko.textContent = s.ko;
          textWrap.appendChild(ko);
          inner.appendChild(textWrap);

          if (s.audio) {
            const sentenceSrc = `data/${s.audio}?t=${Date.now()}`;
            const controls = document.createElement('div');
            controls.className = 'sentence-controls';

            const playBtn = document.createElement('button');
            playBtn.className = 'icon-btn';
            playBtn.title = '재생';
            playBtn.textContent = '▶';
            playBtn.addEventListener('click', () => playSentenceOnce(sentenceSrc, playBtn));
            controls.appendChild(playBtn);

            const loopBtn = document.createElement('button');
            loopBtn.className = 'icon-btn';
            loopBtn.title = '반복 재생';
            loopBtn.textContent = '🔁';
            loopBtn.addEventListener('click', () => toggleSentenceLoop(sentenceSrc, loopBtn));
            controls.appendChild(loopBtn);

            const downloadLink = document.createElement('a');
            downloadLink.className = 'icon-btn';
            downloadLink.title = '다운로드';
            downloadLink.href = sentenceSrc;
            downloadLink.download = `${String(i + 1).padStart(2, '0')}-${(data.date || 'daily')}.mp3`;
            downloadLink.textContent = '⬇';
            controls.appendChild(downloadLink);

            inner.appendChild(controls);
          }

          row.appendChild(inner);
          paragraphContent.appendChild(row);
        });
      } catch (err) {
        paragraphErrorBox.textContent = `오늘의 단락을 불러오지 못했습니다: ${err.message}`;
        paragraphErrorBox.style.display = 'block';
      }
    }

    loadDailyPick();
    loadDailyParagraph();
    loadSavedList();
  </script>
</body>
</html>
