name: 오늘의 영어 한 단락

on:
  # 더 이상 매일 자동으로 돌지 않고, 사이트의 "오늘의 단락 새로 만들기"
  # 버튼(api/generate-paragraph.js)이나 수동 Actions 실행으로만 트리거됨.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-pick:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ffmpeg 설치 (문장별 음성을 전체 음성으로 합치는 데 사용)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 오늘의 영어 단락 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: node scripts/daily-pick.js

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-history.json data/daily-paragraph.json data/daily-paragraph/
          if git diff --cached --quiet; then
            echo "변경 사항이 없어 커밋을 건너뜁니다."
          else
            git commit -m "chore: 오늘의 영어회화 업데이트"
            git push
          fi
