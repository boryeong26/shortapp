name: 대본 생성 (순위 영상)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '주제 (예: 신기한 동물 순간)'
        required: false
        default: '순위 모음'
      selectedClips:
        description: '선택된 5개 클립 (JSON, 페이지에서 자동 생성됨)'
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 대본 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GENERATE_TOPIC: ${{ inputs.topic }}
          SELECTED_CLIPS: ${{ inputs.selectedClips }}
        run: node scripts/generate-script.js

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/latest.json
          if git diff --cached --quiet; then
            echo "변경 사항이 없어 커밋을 건너뜁니다."
          else
            git commit -m "chore: 자동 생성된 대본 업데이트 (${{ inputs.topic }})"
            git push
          fi
