name: 소재수집 + 대본생성

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '주제 (예: 우주, 물리학, 랜덤)'
        required: false
        default: '랜덤'
      tone:
        description: '톤 & 스타일'
        required: false
        default: '흥미진진하고 호기심을 자극하는'
      keyword:
        description: '세부 키워드 (선택)'
        required: false
        default: ''
      duration:
        description: '영상 길이(초)'
        required: false
        default: '60'
        type: choice
        options:
          - '30'
          - '60'
          - '90'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 대본 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GENERATE_TOPIC: ${{ inputs.topic }}
          GENERATE_TONE: ${{ inputs.tone }}
          GENERATE_KEYWORD: ${{ inputs.keyword }}
          GENERATE_DURATION: ${{ inputs.duration }}
        run: node scripts/generate-script.js

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/latest.json
          if git diff --cached --quiet; then
            echo "변경 사항이 없어 커밋을 건너뜁니다."
          else
            git commit -m "chore: 자동 생성된 대본 업데이트 (${{ inputs.topic }})"
            git push
          fi
